{% extends "base_auth.html" %}

{% block title %}Connexion - Abaque Fabrication{% endblock %}

{% block content %}
    <h1 class="text-2xl font-bold text-center mb-8 text-gray-800">Connexion</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-5">
            <label for="username" class="block mb-2 text-gray-600 font-medium">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" required autofocus class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200">
        </div>
        <div class="mb-6">
            <label for="password" class="block mb-2 text-gray-600 font-medium">Mot de passe</label>
            <input type="password" id="password" name="password" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200">
        </div>
        <button type="submit" class="w-full p-3 bg-indigo-500 text-white font-semibold rounded-md hover:bg-purple-600 transition-colors">Se connecter</button>
    </form>
    <div class="my-6 flex items-center gap-3 text-sm text-gray-400">
        <span class="h-px flex-1 bg-gray-200"></span>
        <span>ou</span>
        <span class="h-px flex-1 bg-gray-200"></span>
    </div>
    <a href="{% url 'oidc_authentication_init' %}" class="block w-full p-3 text-center border border-indigo-500 text-indigo-600 font-semibold rounded-md hover:bg-indigo-50 transition-colors">
        Se connecter avec le SSO
    </a>
    <p class="mt-6 text-center text-sm text-gray-600">
        Pas encore de compte ? <a href="{% url 'register' %}" class="text-indigo-500 font-medium hover:underline">S'inscrire</a>
    </p>
{% endblock %}
